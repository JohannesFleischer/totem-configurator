<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>totem-keybard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 27 15.4' fill='%2316171a' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0.0' y='1.8' width='3.4' height='9.6' rx='1'/%3E%3Crect x='4.2' y='0.0' width='3.4' height='9.6' rx='1'/%3E%3Crect x='8.4' y='0.9' width='3.4' height='9.6' rx='1'/%3E%3Crect x='7.4' y='12.2' width='4.4' height='3.0' rx='1'/%3E%3Crect x='23.6' y='1.8' width='3.4' height='9.6' rx='1'/%3E%3Crect x='19.4' y='0.0' width='3.4' height='9.6' rx='1'/%3E%3Crect x='15.2' y='0.9' width='3.4' height='9.6' rx='1'/%3E%3Crect x='15.2' y='12.2' width='4.4' height='3.0' rx='1'/%3E%3C/svg%3E">
<style>/* Modelled on the look of Svalboard's keybard (colours after its kb-* tokens); no keybard code or assets. */
:root {
    --bg: #f1f2f2;
    --surface: #ffffff;
    --ink: #000000;
    --muted: #6b7280;
    --faint: #a7a9ac;
    --line: #e4e5e6;
    --chip: #eaeae9;
    --pick: #3e3e3e;
    --pick-hover: #000000;
    --pick-fg: #ffffff;
    --active: #000000;
    --active-fg: #ffffff;
    --danger: #d8304a;
    --ok: #099e7c;
    --focus: #d8304a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.06);
    --radius: 18px;
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #141517;
        --surface: #1d1e21;
        --ink: #f1f2f2;
        --muted: #9aa0a6;
        --faint: #6b6f76;
        --line: #2c2e33;
        --chip: #26282b;
        --pick: #4a4d52;
        --pick-hover: #6b6f76;
        --active: #e8e9ea;
        --active-fg: #111214;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
        color-scheme: dark;
    }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.hidden { display: none !important; }

/* ---------------------------------------------------------------- shell */
.app { display: flex; height: 100vh; overflow: hidden; }
.nav {
    width: 214px; flex: none; margin: 8px 0 8px 8px; background: var(--surface); border-radius: var(--radius);
    display: flex; flex-direction: column; padding: 18px 12px 12px; box-shadow: var(--shadow); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
.brand svg { width: 34px; height: 20px; color: var(--ink); }
.brand .word { font-size: 27px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.brand .for { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-top: 3px; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 10px;
    border-radius: 10px; color: var(--muted); font-size: 15px; text-align: left; position: relative;
}
.nav-item:hover { color: var(--ink); background: var(--bg); }
.nav-item.on { color: var(--ink); font-weight: 600; }
.nav-item.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--ink); }
.nav-item .count { margin-left: auto; font-size: 11px; color: var(--faint); }
.nav-foot { margin-top: auto; padding: 12px 8px 0; font-size: 11px; color: var(--faint); line-height: 1.5; }

.panel {
    width: 470px; flex: none; margin: 8px 0 8px 8px; background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
}
.panel-head { display: flex; align-items: center; gap: 10px; padding: 20px 18px 10px; }
.panel-head h2 { font-size: 21px; flex: 1; }
.panel-body { padding: 4px 18px 24px; overflow-y: auto; flex: 1; }
.panel-body section { margin-top: 18px; }
.panel-body section > h3 { font-size: 15px; margin-bottom: 8px; }
.icon-btn { border: 0; background: none; padding: 6px; border-radius: 8px; display: inline-flex; color: var(--ink); }
.icon-btn:hover { background: var(--bg); }
.icon-btn:disabled { opacity: 0.3; cursor: default; background: none; }
.title-btn { border: 0; background: none; font: inherit; padding: 2px 6px; margin-left: -6px; border-radius: 8px; text-align: left; }
.title-btn:hover { background: var(--chip); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 24px 18px; position: relative; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 6px; min-height: 40px; flex-wrap: wrap; }
.pill {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 8px 18px;
    background: var(--active); color: var(--active-fg); font-weight: 600; font-size: 14px;
}
.pill:hover { opacity: 0.9; }
.pill.ghost { background: var(--chip); color: var(--ink); }
.pill.ok { background: var(--ok); color: #fff; }
.pill:disabled { opacity: 0.4; cursor: default; }
.vsep { width: 1px; height: 22px; background: var(--faint); margin: 0 8px; opacity: 0.6; }
.status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }

.layerbar { display: flex; align-items: center; gap: 2px; margin-top: 12px; flex-wrap: wrap; }
.layerbar .lbl { color: var(--muted); margin-right: 8px; display: inline-flex; }
.layer-tab {
    border: 0; background: none; min-width: 38px; height: 32px; border-radius: 999px; font-size: 15px; color: var(--muted);
    padding: 0 10px; position: relative;
}
.layer-tab:hover { color: var(--ink); background: var(--chip); }
.layer-tab.on { background: var(--active); color: var(--active-fg); font-weight: 600; }
.layer-tab .swatch { position: absolute; left: 50%; bottom: 2px; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px; }
.layer-tab.empty { opacity: 0.45; }
.layer-title { display: flex; align-items: center; gap: 10px; margin: 16px 0 6px; font-size: 17px; min-height: 34px; }
.layer-name { border: 0; background: none; font-size: 17px; padding: 4px 6px; margin-left: -6px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; }
.layer-name .pen { opacity: 0; color: var(--muted); transition: opacity 0.1s; }
.layer-name:hover { background: var(--chip); }
.layer-name:hover .pen, .layer-name:focus-visible .pen { opacity: 1; }
.layer-name-input { font-size: 16px; width: 220px; }
.layer-tab.named { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; padding: 0 12px; }
.name-row label { width: 44px; flex: none; font-size: 13px; }
.item .sum .nm { color: var(--ink); font-weight: 600; }
.layer-grid .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-title { flex-wrap: wrap; row-gap: 6px; }
.edit-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.edit-tools:empty { display: none; }
.tool {
    display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 6px 12px;
    background: var(--chip); color: var(--ink); font-size: 13px; font-weight: 600;
}
.tool:hover { background: color-mix(in srgb, var(--ink) 12%, var(--chip)); }
.tool.on { background: var(--active); color: var(--active-fg); }
.tool:disabled { opacity: 0.4; cursor: default; background: var(--chip); }
.sel-count { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; padding-left: 8px; }
.sel-count .icon-btn { padding: 3px; }
.edit-tools.mode {
    gap: 10px; padding: 4px 4px 4px 14px; border-radius: 999px; font-weight: 600;
    background: color-mix(in srgb, var(--focus) 10%, var(--surface)); box-shadow: inset 0 0 0 1.5px var(--focus);
}
.edit-tools.mode .slot.sm { min-width: 38px; width: auto; max-width: 110px; height: 30px; padding: 0 6px; font-size: 12px; cursor: default; }
.edit-tools.mode .slot.sm .hdr { font-size: 8px; margin: 0 -6px; }
.pill.sm { padding: 6px 14px; font-size: 13px; }
.layer-ring { width: 26px; height: 26px; border-radius: 50%; border: 3px solid; display: grid; place-items: center; }
.layer-ring::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: currentColor; }

.stage { flex: 1; display: flex; overflow: auto; min-height: 0; padding: 8px 0 16px; }
.stage > .board { margin: auto; }
.footer { display: flex; align-items: flex-end; gap: 16px; min-height: 40px; }
.footer .seg { flex: none; }
.hint { flex: 1; min-width: 0; text-align: center; color: var(--muted); font-size: 13px; padding-bottom: 6px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 6px; color: var(--muted); }
.seg button.on { background: var(--active); color: var(--active-fg); }
.infobox {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
    padding: 8px 14px; font-size: 12px; width: 240px; flex: none; line-height: 1.5;
}
.infobox.hidden { display: block !important; visibility: hidden; }
.infobox b { font-weight: 600; }

/* ---------------------------------------------------------------- board */
.board { position: relative; margin: 0 auto; }
.key {
    position: absolute; display: flex; flex-direction: column; align-items: stretch; border-radius: 7px; overflow: hidden;
    font-weight: 700; text-transform: uppercase; line-height: 1.05; user-select: none; cursor: pointer;
    border: 0; padding: 0; transition: filter 0.08s, box-shadow 0.08s;
}
.key:hover { filter: brightness(1.08); }
.key .hdr { background: rgba(0, 0, 0, 0.32); font-size: 0.62em; padding: 2px 2px 1px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.02em; }
.key .face { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1px 3px; overflow: hidden; }
.key .sub { font-size: 0.72em; opacity: 0.8; }
.key .lbl { white-space: pre-line; }
.key .lit, .pk .lit, .slot .lit { text-transform: none; }
.key.unsupported { outline: 2px dashed #f89804; outline-offset: -5px; }
.key.sel { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--focus); z-index: 3; }
.key.trans .lbl { opacity: 0.75; }
.key.blank { opacity: 0.55; }
.key.pressed { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px #22c55e; filter: brightness(1.25); z-index: 2; }
.key.seen { outline: 2px dashed rgba(255, 255, 255, 0.9); outline-offset: -5px; }
.key.unlock { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--focus); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { filter: brightness(1.3); } }
.board.transmit .key { cursor: copy; }
/* several keys, swapping, Lock key */
.key.flash { animation: keyflash 0.65s ease-out; }
@keyframes keyflash { from { filter: brightness(1.5); box-shadow: 0 0 0 3px var(--surface), 0 0 0 7px var(--ok); } }
.key.swap-src { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--focus); outline: 2px dashed rgba(255, 255, 255, 0.9); outline-offset: -5px; animation: pulse 1.2s infinite; z-index: 3; }
.key.dragging { opacity: 0.3; }
.key.drop { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ok); filter: brightness(1.15); z-index: 3; }
.key.marq { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px color-mix(in srgb, var(--focus) 55%, transparent); z-index: 2; }
.key.ghost { z-index: 100; opacity: 0.92; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); transition: none; cursor: grabbing; }
.key.ghost.copy::after {
    content: "+"; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--ok); color: #fff; font-size: 14px; line-height: 16px; text-align: center;
}
body.dragging-key, body.dragging-key * { cursor: grabbing !important; }
.marquee {
    position: fixed; z-index: 45; pointer-events: none; border-radius: 4px;
    border: 1.5px solid var(--focus); background: color-mix(in srgb, var(--focus) 10%, transparent);
}
.layer-tab.drag-over { color: var(--ink); background: var(--chip); box-shadow: inset 0 0 0 2px var(--ok); }
.stage.mode-lock, .stage.mode-swap { border-radius: 16px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--focus) 30%, transparent); }
.stage.mode-lock .key { cursor: copy; }
.stage.mode-swap .key { cursor: alias; }

/* ---------------------------------------------------------------- picker keys */
.pk {
    min-width: 27px; height: 27px; padding: 0 3px; border: 0; border-radius: 5px; background: var(--pick); color: var(--pick-fg);
    font-size: 9px; font-weight: 700; text-transform: uppercase; line-height: 1.05; display: inline-flex; flex-direction: column;
    align-items: center; justify-content: center; white-space: pre-line; text-align: center; overflow: hidden;
}
.pk:hover { background: var(--pick-hover); }
.pk:disabled { opacity: 0.3; cursor: default; }
.pk .pk-h { font-size: 7px; opacity: 0.75; }
.pk.w36 { min-width: 36px; height: 30px; } .pk.w15 { min-width: 40px; } .pk.w2 { min-width: 52px; } .pk.w25 { min-width: 66px; } .pk.w6 { min-width: 150px; }
.pk.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--focus); }
.kgrid { display: flex; flex-direction: column; gap: 3px; }
.krow { display: flex; gap: 3px; flex-wrap: wrap; }
.krow.center { justify-content: center; }
.krow.fit { flex-wrap: nowrap; }
.krow.fit .pk { min-width: 0; padding: 0 1px; }
.kflow { display: flex; flex-wrap: wrap; gap: 3px; }
.tabs { display: flex; gap: 2px; background: var(--chip); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 0; background: var(--chip); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.chip.on { background: var(--active); color: var(--active-fg); }
.chip.sm { padding: 4px 8px; font-size: 11px; }
.layout-row { margin: -4px 0 10px; }
.layout-fix { color: #b45309; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 4px; }
.layout-fix:empty { display: none; }
.layout-row select { flex: 1; min-width: 0; }
.layout-select.compact { padding: 4px 6px; font-size: 13px; }
.sym-group { display: flex; gap: 8px; align-items: flex-start; }
.sym-level { width: 64px; flex: none; font-size: 11px; color: var(--muted); padding-top: 8px; }
.wrapbox { background: var(--bg); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.wrapbox .lbl { font-size: 12px; color: var(--muted); width: 52px; flex: none; }
select, input[type="number"], input[type="text"] {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; outline: none;
}
select:focus, input:focus { border-color: var(--ink); }
.layer-grid { display: grid; gap: 4px; align-items: center; }
.layer-grid .fn { font-size: 12px; font-weight: 600; color: var(--muted); }

/* ---------------------------------------------------------------- lists & editors */
.list { display: flex; flex-direction: column; gap: 4px; }
.item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; border: 1px solid transparent;
}
.item:hover { background: var(--bg); }
.item.unused { opacity: 0.55; }
.item .num { width: 26px; font-size: 12px; color: var(--muted); font-weight: 600; }
.item .sum { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini { display: inline-flex; gap: 3px; align-items: center; }
.slot {
    width: 46px; height: 46px; border-radius: 8px; border: 2px solid var(--ink); background: var(--surface); padding: 0;
    display: inline-flex; flex-direction: column; align-items: stretch; overflow: hidden; font-size: 10px; font-weight: 700;
    text-transform: uppercase; color: var(--ink); flex: none;
}
.slot.filled { background: var(--pick); color: #fff; border-color: var(--pick); }
.slot.on { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
.slot .hdr { background: rgba(0, 0, 0, 0.35); font-size: 8px; padding: 1px; text-align: center; white-space: nowrap; overflow: hidden; }
.slot .face { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-line; line-height: 1; padding: 1px; overflow: hidden; }
.slot.sm { width: 34px; height: 34px; font-size: 9px; border-width: 1.5px; }
.slot-row { display: flex; align-items: center; gap: 12px; }
.slot-row label { font-size: 13px; color: var(--muted); min-width: 92px; }
.editor { display: flex; flex-direction: column; gap: 12px; }
.editor .help { font-size: 12px; color: var(--muted); line-height: 1.5; background: var(--bg); padding: 8px 10px; border-radius: 10px; }
.mods8 { display: grid; grid-template-columns: repeat(4, auto); gap: 4px; justify-content: start; }
.checks { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.checks label, .check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.checks input, .check input { margin-top: 2px; accent-color: var(--ink); }
.layers16 { display: grid; grid-template-columns: repeat(8, auto); gap: 4px; justify-content: start; }
.action { display: flex; gap: 6px; align-items: flex-start; background: var(--bg); border-radius: 10px; padding: 8px; }
.action select { width: 82px; flex: none; }
.action .body { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
.action input[type="text"] { width: 100%; }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar > div { height: 100%; background: var(--ink); transition: width 0.15s; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; font-size: 13px; }
.notice { background: var(--bg); border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.5; }
.notice.warn { background: color-mix(in srgb, #f89804 16%, var(--surface)); }
.notice.ok { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }

/* ---------------------------------------------------------------- welcome */
.welcome { flex: 1; display: grid; place-items: center; padding: 24px; overflow: auto; }
.welcome-card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 40px; max-width: 620px; width: 100%; text-align: center; }
.welcome-card .brand { justify-content: center; padding: 0 0 6px; }
.welcome-card .brand .word { font-size: 40px; }
.welcome-card .brand svg { width: 54px; height: 31px; }
.welcome-card p { color: var(--muted); line-height: 1.6; }
.welcome-actions { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 26px 0 10px; }
.welcome-actions .pill { min-width: 260px; justify-content: center; padding: 11px 22px; font-size: 15px; }
.welcome-board { margin: 18px auto 4px; opacity: 0.9; }

/* ---------------------------------------------------------------- overlays */
.overlay { position: fixed; inset: 0; background: rgba(17, 18, 20, 0.42); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 20px; padding: 24px; width: min(480px, 100%); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
.modal.wide { width: min(720px, 100%); }
.modal h2 { font-size: 19px; margin-bottom: 10px; }
.modal p { color: var(--muted); line-height: 1.55; margin: 0 0 12px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; align-items: center; }
.toast { background: var(--active); color: var(--active-fg); border-radius: 12px; padding: 10px 16px; font-size: 13px; box-shadow: var(--shadow); max-width: 560px; }
.toast.error { background: var(--danger); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }

@media (max-width: 1180px) {
    .panel { width: 450px; }
    .infobox, .infobox.hidden { display: none !important; }
    .nav { width: 64px; padding: 14px 8px; }
    .nav .brand .word, .nav .brand .for, .nav-item span, .nav-item .count, .nav-foot { display: none; }
    .nav .brand { padding: 0 4px 16px; justify-content: center; }
    .nav-item { justify-content: center; padding: 10px 0; }
}
@media (max-width: 960px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
    .nav { width: auto; margin: 8px 8px 0; flex-direction: row; overflow-x: auto; padding: 8px; }
    .nav .brand { padding: 0 8px 0 4px; }
    .nav-sep, .nav-foot { display: none; }
    .nav-item.on::before { display: none; }
    .panel { width: auto; margin: 8px 8px 0; max-height: 60vh; }
    .main { padding: 12px 16px 70px; overflow: visible; }
    .stage { overflow-x: auto; justify-content: flex-start; }
    .infobox { display: none; }
}

/* ---------------------------------------------------------------- desktop overlay (#overlay) */
html.ovl-page, html.ovl-page body { background: transparent !important; overflow: hidden; }
html.ovl-page #app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ovl { display: flex; flex-direction: column; align-items: center; transition: opacity 0.15s; }
.ovl.ovl-away { opacity: 0 !important; }
.ovl .board { margin: 0; }
.ovl .key {
    cursor: default; text-transform: none; transition: background-color 0.08s;
    box-shadow: inset 0 0 0 var(--ov-ow) var(--ov-outline); text-shadow: var(--ov-shadow);
}
.ovl .key:hover { filter: none; }
.ovl .key .hdr { background: rgba(0, 0, 0, 0.22); }
.ovl .key.blank { opacity: 1; }
.ovl .key.trans .lbl { opacity: 0.6; }
.ovl .key.through .face, .ovl .key.through .hdr { opacity: 0.5; }
.ovl .key.held { background: var(--ov-held) !important; box-shadow: inset 0 0 0 var(--ov-ow) var(--ov-outline), 0 0 10px var(--ov-held); }
.ovl .key.held .face, .ovl .key.held .hdr { opacity: 1; }
.ovl-title {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 0.45em; font-weight: 700; white-space: nowrap;
    padding: 0 0.2em; text-shadow: var(--ov-shadow);
}
.ovl-dot { width: 0.7em; height: 0.7em; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35); }
.ovl-num { opacity: 0.7; font-weight: 600; }
.ovl-mod { font-size: 0.75em; padding: 0 0.45em; border-radius: 999px; background: rgba(0, 0, 0, 0.45); color: #fff; text-shadow: none; }
.ovl-flash .key { animation: ovlflash 0.5s ease-out both; animation-delay: var(--ov-delay); }
@keyframes ovlflash { from { box-shadow: inset 0 0 0 2px var(--ov-flash), 0 0 14px var(--ov-flash); filter: brightness(1.5); } }
.ovl-fade .board { animation: ovlfade 0.3s ease-out both; animation-delay: var(--ov-delay); }
@keyframes ovlfade { from { opacity: 0.1; } }
.ovl-status {
    position: fixed; left: 6px; bottom: 6px; max-width: calc(100% - 12px); padding: 5px 10px; border-radius: 10px; font-size: 12px;
    background: rgba(20, 21, 23, 0.82); color: #fff; line-height: 1.4;
}
.ovl-status.noreport, .ovl-status.error { background: rgba(160, 80, 0, 0.9); }
.ovl-adjust {
    position: fixed; inset: 0; border: 2px dashed rgba(255, 255, 255, 0.9); border-radius: 10px;
    background: rgba(20, 21, 23, 0.35); -webkit-app-region: drag; app-region: drag; cursor: move;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
}
.ovl-adjust-bar {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
    background: rgba(20, 21, 23, 0.9); color: #fff; border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 12px; white-space: nowrap;
}
.ovl-adjust-bar button {
    -webkit-app-region: no-drag; app-region: no-drag; border: 0; border-radius: 999px; padding: 4px 12px; font-size: 12px;
    font-weight: 600; background: rgba(255, 255, 255, 0.15); color: #fff;
}
.ovl-adjust-bar button.done { background: #fff; color: #111; }
.ovl-grip {
    position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; -webkit-app-region: no-drag; app-region: no-drag;
    background: linear-gradient(135deg, transparent 50%, rgba(255, 255, 255, 0.95) 50%); border-bottom-right-radius: 8px;
}

/* ---------------------------------------------------------------- overlay settings (#overlay-settings) */
html.ovl-settings-page body { background: var(--bg); }
.ov-settings { max-width: 760px; margin: 0 auto; padding: 18px 20px 40px; }
.ov-settings section { margin-top: 20px; }
.ov-settings section > h3 { font-size: 15px; margin-bottom: 10px; }
.ov-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.ov-head h2 { font-size: 24px; }
.ov-status { display: flex; align-items: center; gap: 10px; }
.ov-status.ok { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
.ov-status.warn { background: color-mix(in srgb, #f89804 16%, var(--surface)); }
.ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; margin: 10px 0; }
.ov-row { display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 30px; }
.ov-lbl { width: 92px; flex: none; color: var(--muted); }
.ov-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--ink); }
.ov-row input[type="color"] { width: 44px; height: 28px; padding: 0 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.ov-val { width: 46px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.ov-preview {
    margin-top: 10px; border-radius: 14px; display: grid; place-items: center; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
}
.ov-preview.bg-dark { background: #1e1f24; }
.ov-preview.bg-light { background: #f4f4f2; }
.ov-preview.bg-busy {
    background:
        repeating-linear-gradient(0deg, transparent 0 14px, rgba(0, 0, 0, 0.06) 14px 16px),
        linear-gradient(90deg, #fbfbfa 0 38%, #2b2d33 38% 70%, #3d6fb6 70%);
}
.ov-preview > div { display: flex; flex-direction: column; align-items: center; justify-content: center; }
@media (max-width: 640px) { .ov-grid { grid-template-columns: 1fr; } }

/* the overlay while unlocking: opaque, with the keys to hold */
.ovl-unlock {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 14px 12px; border-radius: 14px; background: rgba(22, 23, 26, 0.95); color: #fff;
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.18);
}
.ovl-unlock-head { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.3; }
.ovl-unlock-head b { font-size: 1.15em; }
.ovl-unlock-head span { opacity: 0.8; font-size: 0.85em; }
.ovl-unlock-board { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.ovl-unlock .key { cursor: default; text-transform: none; }
.ovl-unlock .key:hover { filter: none; }
.ovl-unlock .key.unlock { box-shadow: 0 0 0 2px #fff, 0 0 16px #d8304a; }
.ovl-unlock-bar { width: min(420px, 80%); height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); overflow: hidden; flex: none; }
.ovl-unlock-bar > div { height: 100%; background: #d8304a; transition: width 0.15s; }
.ovl-unlock.done .ovl-unlock-bar > div { background: #099e7c; }
.ovl-unlock.error .ovl-unlock-head b { color: #ffb4a8; }
.ov-unlock-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
</style>
